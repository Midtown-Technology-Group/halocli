name: Build MSI Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to package
        required: true
        default: 0.8.1

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Resolved before checkout so the tag can drive it: a manual dispatch
      # would otherwise build whatever branch the run was triggered from (the
      # default branch), and attach those bits to an older release. String
      # manipulation only -- no repo files needed yet.
      - name: Set package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Release tags must use the vX.Y.Z format so installer URLs match release assets."
            }
            $version = $tag.TrimStart("v")
            "tag=$tag" >> $env:GITHUB_OUTPUT
          } else {
            $version = "${{ inputs.version }}"
            "tag=v$version" >> $env:GITHUB_OUTPUT
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Build exactly what the tag points at. A tag that does not exist yet
          # fails here, which is correct: an MSI for untagged code has no
          # release to attach to and no reproducible source.
          ref: ${{ steps.version.outputs.tag }}

      # Tag-vs-release: decide from whether a release EXISTS for this tag, not
      # from how the run was triggered. Releases are created by the Release
      # workflow using GITHUB_TOKEN, and token-created releases do not fire
      # `release: published` -- so gating on github.event_name meant every
      # manually-dispatched MSI run skipped the upload and the winget notify.
      # That left 0.7.0 through 0.8.0 with no MSI on the release page and
      # mtg-winget frozen at 0.5.0.
      - name: Check whether a release exists for this tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ErrorActionPreference = "Continue"
          $output = (gh release view "$tag" --json tagName 2>&1 | Out-String).Trim()
          $code = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          # Only a confirmed "not found" means absence. An auth failure, an API
          # outage or a network error must fail the run: silently recording
          # exists=false would skip the upload and the winget notify even though
          # the release is sitting there waiting for its MSI.
          if ($code -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag exists."
          } elseif ($output -match "release not found") {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No release for $tag yet; MSI goes to the workflow artifact only."
          } else {
            throw "Failed to determine whether release $tag exists (exit ${code}): $output"
          }
          exit 0

      - name: Set up Python
        # The interpreter PyInstaller embeds in halocli.exe, so this choice is
        # shipped to every MSI install target. 3.14 is current stable (bugfix
        # through 2030-10); 3.10 was pinned here until it went EOL 2026-10-31.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 4.*

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build MSI
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Get MSI metadata
        id: msi
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/halocli.msi -Algorithm SHA256).Hash.ToLower()
          # Select-Object -Last 1 plus Trim: get_msi_product_code.ps1 used to
          # emit an empty string alongside the GUID, and interpolating that
          # array produced " {C664...}" -- a ProductCode with a leading space,
          # which is what the first machine-generated winget manifest shipped.
          # Validate as a bare GUID so a regression fails here instead of at
          # winget publish time.
          $productCode = ((./scripts/get_msi_product_code.ps1 -Path dist/halocli.msi) | Select-Object -Last 1).ToString().Trim()
          if ($productCode -notmatch '^\{[0-9A-Fa-f-]{36}\}$') {
            throw "ProductCode is not a bare GUID: '$productCode'"
          }
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "product_code=$productCode" >> $env:GITHUB_OUTPUT

      - name: Upload MSI to release
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/halocli.msi --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Always publish the artifact: it is the only way to fetch an MSI for a
      # tag that has no release yet, and it expires on its own.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halocli-msi
          path: dist/halocli.msi

      - name: Notify mtg-winget
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MTG_WINGET_DISPATCH_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $sha = "${{ steps.msi.outputs.sha256 }}"
          $productCode = "${{ steps.msi.outputs.product_code }}"
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Warning "MTG_WINGET_DISPATCH_TOKEN is not configured; skipping mtg-winget dispatch."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($version) -or [string]::IsNullOrWhiteSpace($tag) -or [string]::IsNullOrWhiteSpace($sha) -or [string]::IsNullOrWhiteSpace($productCode)) {
            throw "Missing version, tag, SHA256, or ProductCode for mtg-winget dispatch."
          }
          $body = @{
            event_type = "update-package"
            client_payload = @{
              package_key = "halocli"
              version = $version
              installer_url = "https://github.com/Midtown-Technology-Group/halocli/releases/download/$tag/halocli.msi"
              sha256 = $sha
              product_code = $productCode
            }
          } | ConvertTo-Json -Depth 5
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "Failed to build mtg-winget dispatch payload."
          }
          $body | Set-Content dispatch.json
          if (-not (Test-Path dispatch.json)) {
            throw "Failed to write dispatch.json."
          }
          gh api repos/Midtown-Technology-Group/mtg-winget/dispatches --method POST --input dispatch.json
          if ($LASTEXITCODE -ne 0) {
            throw "mtg-winget repository dispatch failed."
          }
