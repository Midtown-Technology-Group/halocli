name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs cancel: rapid pushes to the same ref should not stack
# full matrix runs (the dance merges quickly).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Hard bound: a hung install/test must die here, not on GitHub's 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: CLI smoke test
        run: |
          halocli --version
          halocli --help
          halocli auth discover --help
          halocli tickets list --help

  coverage:
    name: Coverage Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # Type gate: clean baseline (findings fixed, not suppressed).
      - name: Type check
        run: mypy src/halocli --ignore-missing-imports

      # Report-only baseline (no floor yet): publishes the number we would
      # later gate on. Runs under -n auto like every other pytest invocation.
      - name: Test with coverage
        run: python -m pytest -q --cov=halocli --cov-report=term-missing --cov-report=json:pytest-coverage.json --cov-report=xml:coverage.xml

      - name: Upload pytest coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-coverage
          path: pytest-coverage.json
          if-no-files-found: ignore

      - name: Upload Sonar coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage
          path: coverage.xml
          if-no-files-found: error

      # Fails when registry write metadata points at endpoints the spec lacks
      # (the /Contract bug class). read_mismatches is report-only: those are
      # documented by tests and may be legitimately undocumented endpoints.
      - name: Spec-vs-registry coverage gate
        run: python scripts/coverage_report.py --check --top 50 > coverage-report.json

      # Fails when the committed ledger is stale OR when the spec contains
      # segments coverage_policy.json has never classified - completeness of
      # endpoint classification is enforced, not aspirational.
      - name: Coverage ledger gate
        run: python scripts/build_coverage_ledger.py --check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report.json
          if-no-files-found: ignore

  package:
    name: Package Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging baseline
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install release tools
        run: python -m pip install ".[release]"

      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*.tar.gz dist/*.whl

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/halocli-sbom.cdx.json

      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off --skip-editable .

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halocli-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/*sbom*.json

  sonar:
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: Midtown-Technology-Group/engineering-workflows/.github/workflows/sonar.yml@bc3b6f7099177c00ac728d6d32d83fc8dcf76d84
    with:
      project-key: Midtown-Technology-Group_halocli
      organization: midtown-technology-group
      coverage-artifact: sonar-coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
