[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halocli"
version = "1.13.0"
description = "Standalone HaloPSA CLI for safe operator and automation workflows"
readme = "README.md"
license = "GPL-3.0-only"
# Floor is 3.12 (EOL 2028-10). 3.10 goes EOL on 2026-10-31 and 3.11 on
# 2027-10; rather than test versions that are dead or nearly dead, support
# starts at a release with years of security coverage left. Users pinned to
# older interpreters should stay on 0.8.2.
requires-python = ">=3.12"
authors = [{name = "Midtown Technology Group", email = "info@midtowntg.com"}]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.2.1",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0.0",
    "keyring>=25.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "fastapi>=0.111.0",
    # Pins the overlay's interop claim: every target in halo_overlay.json must
    # parse as standard JSONPath and resolve, so external runners (Forge et al)
    # applying the same file do not silently skip actions ours applies.
    "jsonpath-ng>=1.6.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    # A hung test must fail fast with stack dumps instead of eating GitHub's
    # 6-hour default (a local hang cost 30 minutes once; see pytest config).
    "pytest-timeout>=2.3.0",
    # Parallel workers (see addopts; disable with -n0) and coverage numbers
    # (report-only in CI; no floor yet - baseline first).
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "ruff>=0.1.0",
    "uvicorn>=0.30.0",
]
web = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
release = [
    "build>=1.0.0",
    "cyclonedx-bom>=5.0.0",
    "pip-audit>=2.7.0",
    "twine>=5.0.0",
]
microsoft-todo = [
    "mtg-microsoft-auth @ git+https://github.com/Midtown-Technology-Group/mtg-microsoft-auth.git@main",
]

[project.scripts]
halocli = "halocli.cli:main"

[project.urls]
Homepage = "https://github.com/Midtown-Technology-Group/halocli"
Repository = "https://github.com/Midtown-Technology-Group/halocli"
Issues = "https://github.com/Midtown-Technology-Group/halocli/issues"
Changelog = "https://github.com/Midtown-Technology-Group/halocli/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
halocli = ["spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Parallel by default: 531 tests serialise to ~68s and drop to ~36s on
# workers. Only one test binds the fixed callback port, so no cross-worker
# collision (verified locally and across the CI matrix). Debug serially
# with: pytest -n0
addopts = "-n auto"
# Every test must finish in 60s (slowest today: ~5s). The thread method is
# deliberate: on timeout it dumps all thread stacks and crashes the RUN, which
# fails fast on CI (and locally) instead of hanging for hours; it is also the
# only method that works on Windows.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# Clean baseline as of the initial triage: every finding was fixed properly
# (corrected annotations, narrowing, and cast at the validated boundary) -
# no blanket suppressions. Run: mypy src/halocli --ignore-missing-imports
ignore_missing_imports = true

# Lock the rule set explicitly: ruff 0.16 broadened its defaults (adding BLE,
# B, DTZ, TRY, I, UP, RUF, PL...), which broke CI on code that passed 0.15.
# Pinning selection here keeps the effective rules identical across ruff
# versions; revisit deliberately if we want to adopt the broader set.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
